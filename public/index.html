<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="King's Newsletter: política, economia, tecnologia, Brasil e mundo.">
  <title>King's Newsletter - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="logo">
        <div class="logo-top"><i class="fas fa-crown"></i> KING'S</div>
        <div class="logo-bottom">Newsletter</div>
      </div>
      <nav>
        <ul>
          <li><a href="/" class="active">Home</a></li>
          <li><a href="editions">Edições</a></li>
          <li><a href="about">Sobre</a></li>
        </ul>
      </nav>
      <div class="theme-toggle">
        <span class="theme-label" id="theme-label"></span>
        <label class="switch">
          <input type="checkbox" id="theme-switch">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow" id="edition-date">CARREGANDO...</p>
        <h1>As notícias que importam,<br>sem enrolação.</h1>
        <p class="lead">Um briefing direto com resumo e contexto sobre política, economia, tecnologia, Brasil e mundo.</p>
        <a href="/editions" class="cta-button">Ver Edição Atual</a>
      </section>
      
      <section class="preview-section">
        <h2>Destaque de Hoje</h2>
        <div id="featured-news" class="featured-news"></div>
      </section>
    </main>

    <div id="footer"></div>
    
    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <h3>Histórico de Publicações</h3>
        <button class="close-history" id="close-history">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
  <script src="js/footer.js"></script>
  <script src="js/script.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
