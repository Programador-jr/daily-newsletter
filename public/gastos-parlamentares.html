<!doctype html>
<html lang="pt-BR" class="history-document">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ranking de gastos parlamentares de deputados federais com dados da Câmara dos Deputados.">
<title>King's Newsletter - Gastos Parlamentares</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/historia.css">
<link rel="stylesheet" href="/css/gastos-parlamentares.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="history-page parliamentary-expenses-page">
<div class="container">
<header class="site-header">
  <div class="logo"><div class="logo-top"><i class="fas fa-crown"></i> KING'S</div><div class="logo-bottom">Newsletter</div></div>
  <nav class="header-main-nav" aria-label="Navegação principal">
    <div class="header-primary-links"></div>
    <div class="header-nav-actions">
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Abrir menu de navegação" aria-controls="site-sidebar" aria-expanded="false" title="Abrir menu">
        <span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </nav>
</header>
<aside class="site-sidebar" id="site-sidebar" aria-label="Navegação principal" aria-hidden="true">
  <div class="site-sidebar-header">
    <div><span class="eyebrow">King's Newsletter</span><strong>Navegação</strong></div>
    <button class="site-sidebar-close" id="site-sidebar-close" type="button" aria-label="Fechar navegação"><i class="fas fa-xmark"></i></button>
  </div>
  <nav class="site-sidebar-nav" aria-label="Páginas principais">
    <div class="site-sidebar-group"><span class="site-sidebar-label">Páginas principais</span></div>
  </nav>
  <div class="site-sidebar-preferences">
    <span class="site-sidebar-label">Preferências</span>
    <button class="sidebar-theme-toggle" id="theme-toggle" type="button" aria-label="Ativar tema escuro" title="Ativar tema escuro" aria-pressed="false">
      <span class="theme-switch-track" aria-hidden="true"><i class="fas fa-moon" id="theme-icon"></i></span><span>Tema</span>
    </button>
  </div>
</aside>
<div class="site-sidebar-backdrop" id="site-sidebar-backdrop" aria-hidden="true"></div>

<main>
<section class="history-hero expenses-hero">
  <span class="eyebrow">Política · Transparência</span>
  <h1>Gastos Parlamentares</h1>
</section>

<section class="expenses-section" id="ranking">
  <div class="expense-explorer">
    <div class="expense-filters">
      <label>Ano
        <select id="expense-year" aria-label="Ano">
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
      </label>
      <label>Estado
        <select id="expense-state" aria-label="Estado">
          <option value="">Todos os estados</option>
          <option value="AC">Acre (AC)</option><option value="AL">Alagoas (AL)</option><option value="AP">Amapá (AP)</option>
          <option value="AM">Amazonas (AM)</option><option value="BA">Bahia (BA)</option><option value="CE">Ceará (CE)</option>
          <option value="DF">Distrito Federal (DF)</option><option value="ES">Espírito Santo (ES)</option><option value="GO">Goiás (GO)</option>
          <option value="MA">Maranhão (MA)</option><option value="MT">Mato Grosso (MT)</option><option value="MS">Mato Grosso do Sul (MS)</option>
          <option value="MG">Minas Gerais (MG)</option><option value="PA">Pará (PA)</option><option value="PB">Paraíba (PB)</option>
          <option value="PR">Paraná (PR)</option><option value="PE">Pernambuco (PE)</option><option value="PI">Piauí (PI)</option>
          <option value="RJ">Rio de Janeiro (RJ)</option><option value="RN">Rio Grande do Norte (RN)</option><option value="RS">Rio Grande do Sul (RS)</option>
          <option value="RO">Rondônia (RO)</option><option value="RR">Roraima (RR)</option><option value="SC">Santa Catarina (SC)</option>
          <option value="SP">São Paulo (SP)</option><option value="SE">Sergipe (SE)</option><option value="TO">Tocantins (TO)</option>
        </select>
      </label>
      <label>Ordenar por
        <select id="expense-order" aria-label="Ordenação">
          <option value="desc">Maior para menor</option>
          <option value="asc">Menor para maior</option>
        </select>
      </label>
      <button id="expense-search" type="button">Consultar</button>
    </div>

    <p class="expense-status" id="expense-status" aria-live="polite">Selecione os filtros e clique em Consultar.</p>

    <div class="ranking-table-wrap" id="ranking-table-wrap" hidden>
      <table class="ranking-table">
        <thead><tr><th>Posição</th><th>Deputado</th><th>UF</th><th>Partido</th><th>Total gasto</th></tr></thead>
        <tbody id="ranking-table-body"></tbody>
      </table>
    </div>
  </div>
</section>
</main>
</div>
<script src="/js/sidebar.js"></script>
<script src="/js/gastos-parlamentares.js"></script>
</body>
</html>
