<!doctype html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=20261020">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=20261020">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="King's Newsletter - confirmação da inscrição">
  <title>King's Newsletter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/editorial.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/subscription-status.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/js/vercel-observability.js" defer></script>
</head>
<body class="editorial-page">
  <a class="skip-link" href="#status-content">Pular para o conteúdo</a>
  <div class="container subscription-status-page">
    <header class="site-header">
      <a class="logo" href="/" aria-label="Página inicial"><div class="logo-top"><i class="fas fa-crown" aria-hidden="true"></i> KING'S</div><div class="logo-bottom">Newsletter</div></a>
      <nav class="header-main-nav" aria-label="Navegação principal">
        <div class="header-primary-links"></div>
        <div class="header-nav-actions"><button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Abrir menu de navegação" aria-controls="site-sidebar" aria-expanded="false" title="Abrir menu"><span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span></button></div>
      </nav>
    </header>
    <aside class="site-sidebar" id="site-sidebar" aria-label="Navegação principal" aria-hidden="true">
      <div class="site-sidebar-header"><div><span class="eyebrow">King's Newsletter</span><strong>Navegação</strong></div><button class="site-sidebar-close" id="site-sidebar-close" type="button" aria-label="Fechar navegação"><i class="fas fa-xmark" aria-hidden="true"></i></button></div>
      <nav class="site-sidebar-nav" aria-label="Páginas principais"></nav>
      <div class="site-sidebar-preferences"><span class="site-sidebar-label">Preferências</span><button class="sidebar-theme-toggle" id="theme-toggle" type="button" aria-label="Ativar tema escuro" title="Ativar tema escuro" aria-pressed="false"><span class="theme-switch-track" aria-hidden="true"><i class="fas fa-moon" id="theme-icon"></i></span><span>Tema</span></button></div>
    </aside>
    <div class="site-sidebar-backdrop" id="site-sidebar-backdrop" aria-hidden="true"></div>

    <main class="subscription-status" id="status-content" tabindex="-1">
      <div class="subscription-status-icon" id="status-icon"></div>
      <p class="eyebrow">King's Newsletter</p>
      <h1 id="status-title">Processando...</h1>
      <p id="status-message">Aguarde enquanto verificamos sua solicitação.</p>
      <div class="subscription-status-actions" id="status-actions">
        <a href="/" class="cta-button">Voltar para a Newsletter</a>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="js/footer.js"></script>
  <script src="/js/accordion-motion.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    const token = params.get('token');

    const content = {
      confirmed: {
        title: 'Inscrição confirmada!',
        message: 'Seu e-mail foi confirmado. A partir de agora, você receberá as novas atualizações do King\'s Newsletter.',
        icon: '<i class="fas fa-check"></i>',
        className: 'success'
      },
      'unsubscribe-confirm': {
        title: 'Tem certeza que deseja cancelar?',
        message: 'Vamos sentir sua falta por aqui. Se você cancelar, deixará de receber as próximas atualizações do King\'s Newsletter.',
        icon: '<i class="fas fa-envelope"></i>',
        className: 'warning'
      },
      unsubscribed: {
        title: 'Inscrição cancelada',
        message: 'Tudo certo. Seu e-mail foi removido da lista de atualizações e você não receberá mais os próximos e-mails da Newsletter.',
        icon: '<i class="fas fa-check"></i>',
        className: 'success'
      },
      invalid: {
        title: 'Link inválido ou expirado',
        message: 'Este link não é mais válido. Se precisar, faça uma nova solicitação pela página da Newsletter.',
        icon: '<i class="fas fa-exclamation"></i>',
        className: 'error'
      },
      error: {
        title: 'Não foi possível concluir',
        message: 'Ocorreu um problema ao processar sua solicitação. Tente novamente mais tarde.',
        icon: '<i class="fas fa-exclamation"></i>',
        className: 'error'
      }
    };

    const result = content[status] || content.error;
    document.title = result.title + ' — King\'s Newsletter';
    document.getElementById('status-title').textContent = result.title;
    document.getElementById('status-message').textContent = result.message;

    const icon = document.getElementById('status-icon');
    icon.innerHTML = result.icon;
    icon.className = 'subscription-status-icon ' + result.className;

    const actions = document.getElementById('status-actions');

    if (status === 'unsubscribe-confirm' && token) {
      actions.replaceChildren();
      const form = document.createElement('form');
      form.method = 'POST'; form.action = '/api/unsubscribe';
      const hidden = document.createElement('input');
      hidden.type = 'hidden'; hidden.name = 'token'; hidden.value = token;
      const submit = document.createElement('button');
      submit.type = 'submit'; submit.className = 'cta-button'; submit.textContent = 'Sim, cancelar inscrição';
      form.append(hidden, submit);
      const keep = document.createElement('a');
      keep.href = '/'; keep.className = 'subscription-secondary-button'; keep.textContent = 'Manter minha inscrição';
      actions.append(form, keep);
    } else if (status === 'unsubscribe-confirm') {
      actions.replaceChildren();
      const back = document.createElement('a');
      back.href = '/'; back.className = 'cta-button'; back.textContent = 'Voltar para a Newsletter';
      actions.append(back);
    } else if (status === 'invalid') {
      actions.replaceChildren();
      const resend = document.createElement('a');
      resend.href = '/?resend=1#subscription-title'; resend.className = 'cta-button'; resend.textContent = 'Reenviar confirmação';
      const back = document.createElement('a');
      back.href = '/'; back.className = 'subscription-secondary-button'; back.textContent = 'Voltar para a Newsletter';
      actions.append(resend, back);
    }
  </script>
</body>
</html>
