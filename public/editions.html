<body class="editorial-page">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="container">
    <header class="site-header">
      <a class="logo" href="/" aria-label="Página inicial"><div class="logo-top"><i class="fas fa-crown" aria-hidden="true"></i> KING'S</div><div class="logo-bottom">Newsletter</div></a>
      <nav class="header-main-nav" aria-label="Navegação principal">
        <div class="header-primary-links"></div>
        <div class="header-nav-actions"><button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Abrir menu de navegação" aria-controls="site-sidebar" aria-expanded="false" title="Abrir menu"><span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span></button></div>
      </nav>
    </header>
    <aside class="site-sidebar" id="site-sidebar" aria-label="Navegação principal" aria-hidden="true">
      <div class="site-sidebar-header"><div><span class="eyebrow">King's Newsletter</span><strong>Navegação</strong></div><button class="site-sidebar-close" id="site-sidebar-close" type="button" aria-label="Fechar navegação"><i class="fas fa-xmark" aria-hidden="true"></i></button></div>
      <nav class="site-sidebar-nav" aria-label="Páginas principais"></nav>
      <div class="site-sidebar-preferences"><span class="site-sidebar-label">Preferências</span><button class="sidebar-theme-toggle" id="theme-toggle" type="button" aria-label="Ativar tema escuro" title="Ativar tema escuro" aria-pressed="false"><span class="theme-switch-track" aria-hidden="true"><i class="fas fa-moon" id="theme-icon"></i></span><span>Tema</span></button></div>
    </aside>
    <div class="site-sidebar-backdrop" id="site-sidebar-backdrop" aria-hidden="true"></div>

    <main id="main" tabindex="-1">
      <section class="editions">
        <div class="editions-heading"><div><span class="eyebrow">Arquivo editorial</span><h1 id="edition-title">Edição Atual</h1></div><p>Consulte a edição de hoje ou pesquise pelo histórico.</p></div>
        <div class="filter-buttons" id="filter-buttons">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="Política">Política</button>
          <button class="filter-btn" data-filter="Economia">Economia</button>
          <button class="filter-btn" data-filter="Tecnologia">Tecnologia</button>
          <button class="filter-btn" data-filter="Brasil">Brasil</button>
          <button class="filter-btn" data-filter="Mundo">Mundo</button>
        </div>
        <div id="news-grid" class="news-grid" aria-live="polite"></div>
      </section>
    </main>

    <div id="footer"></div>

    <button class="history-toggle" id="history-toggle" type="button" aria-label="Abrir histórico de publicações" title="Histórico de Publicações">
      <i class="fas fa-clock-rotate-left"></i>
    </button>

    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <h3>Histórico de Publicações</h3>
        <button class="close-history" id="close-history" type="button" aria-label="Fechar histórico de edições">
          <i class="fas fa-times" aria-hidden="true"></i>
