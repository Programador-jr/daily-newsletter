<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="King's Newsletter: política, economia, tecnologia, Brasil e mundo.">
  <title>King's Newsletter - Edições</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="logo">
        <div class="logo-top"><i class="fas fa-crown"></i> KING'S</div>
        <div class="logo-bottom">Newsletter</div>
      </div>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="editions" class="active">Edições</a></li>
          <li><a href="about">Sobre</a></li>
        </ul>
        <div class="nav-search">
          <input type="text" id="search-input" placeholder="Buscar notícias...">
          <i class="fas fa-search"></i>
        </div>
      </nav>
      <div class="theme-toggle">
        <span class="theme-label" id="theme-label"></span>
        <label class="switch">
          <input type="checkbox" id="theme-switch">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <main>
      <section class="editions">
        <div class="editions-heading"><div><span class="eyebrow">Arquivo editorial</span><h2 id="edition-title">Edição Atual</h2></div><p>Consulte a edição de hoje ou pesquise pelo histórico.</p></div>
        <div class="filter-buttons" id="filter-buttons">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="Política">Política</button>
          <button class="filter-btn" data-filter="Economia">Economia</button>
          <button class="filter-btn" data-filter="Tecnologia">Tecnologia</button>
          <button class="filter-btn" data-filter="Brasil">Brasil</button>
          <button class="filter-btn" data-filter="Mundo">Mundo</button>
        </div>
        <div id="news-grid" class="news-grid" aria-live="polite"></div>
      </section>
    </main>

    <div id="footer"></div>
    
    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <h3>Histórico de Publicações</h3>
        <button class="close-history" id="close-history">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
  <script src="js/script.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
